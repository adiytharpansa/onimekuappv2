name: release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag GitHub Release untuk APK release (kosongkan bila tanpa rilis)"
        required: false
        default: ""
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Unit test
        run: gradle :app:testDebugUnitTest
      - name: Decode keystore
        run: echo "${{ secrets.ONIMEKU_STORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK + AAB (R8)
        run: >
          gradle :app:assembleRelease :app:bundleRelease
          -PONIMEKU_STORE_FILE="$RUNNER_TEMP/release.jks"
          -PONIMEKU_STORE_PASS="${{ secrets.ONIMEKU_STORE_PASS }}"
          -PONIMEKU_KEY_ALIAS="${{ secrets.ONIMEKU_KEY_ALIAS }}"
          -PONIMEKU_KEY_PASS="${{ secrets.ONIMEKU_KEY_PASS }}"
          -PONIMEKU_FIREBASE_PROJECT_ID="${{ secrets.ONIMEKU_FIREBASE_PROJECT_ID }}"
          -PONIMEKU_FIREBASE_API_KEY="${{ secrets.ONIMEKU_FIREBASE_API_KEY }}"
      - uses: actions/upload-artifact@v4
        with: { name: onimeku-release-aab, path: app/build/outputs/bundle/release/*.aab }
      - uses: actions/upload-artifact@v4
        with: { name: onimeku-release-apk, path: app/build/outputs/apk/release/*.apk }
      - name: Create GitHub Release with release APK
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Onimeku Release ${{ inputs.release_tag }}
          body: |
            APK RELEASE penuh Onimeku (Kotlin / Jetpack Compose) dari branch main.

            - assembleRelease + R8 (minify + shrink resources), ditandatangani keystore rilis khusus Onimeku Kotlin.
            - Tanpa API katalog: daftar, detail, dan stream dibaca dari katalog gudang terenkripsi + cermin; akun/komentar/sinkron + loker kunci memakai Firebase proyek khusus Onimeku.
          files: app/build/outputs/apk/release/*.apk
