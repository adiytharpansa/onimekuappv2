name: release
on:
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Unit test
        run: gradle :app:testDebugUnitTest
      - name: Decode keystore
        run: echo "${{ secrets.ONIMEKU_STORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed AAB (R8)
        run: >
          gradle :app:bundleRelease
          -PONIMEKU_STORE_FILE="$RUNNER_TEMP/release.jks"
          -PONIMEKU_STORE_PASS="${{ secrets.ONIMEKU_STORE_PASS }}"
          -PONIMEKU_KEY_ALIAS="${{ secrets.ONIMEKU_KEY_ALIAS }}"
          -PONIMEKU_KEY_PASS="${{ secrets.ONIMEKU_KEY_PASS }}"
          -PONIMEKU_SUPABASE_URL="${{ secrets.ONIMEKU_SUPABASE_URL }}"
          -PONIMEKU_SUPABASE_KEY="${{ secrets.ONIMEKU_SUPABASE_KEY }}"
      - uses: actions/upload-artifact@v4
        with: { name: onimeku-release-aab, path: app/build/outputs/bundle/release/*.aab }
