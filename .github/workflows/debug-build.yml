name: Debug build (errors as annotations)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Emit error annotations
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          grep -aE '^e: | error: |FAILURE:|What went wrong|requires libraries|Could not (resolve|find|download)|> Task .* FAILED|Caused by:|Compilation error|Unresolved reference|AAPT|Execution failed' build.log \
            | head -45 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g' | cut -c1-900)
              echo "::error title=Build error::$msg"
            done

      - name: Emit log tail
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          tail -n 8 build.log | while IFS= read -r line; do
            msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g' | cut -c1-900)
            echo "::error title=Log tail::$msg"
          done

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
