name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          {
            echo '## Gradle failure details'
            echo '\`\`\`text'
            grep -E '(^e: |^w: |What went wrong|Could not |FAILURE:|error:|Execution failed|^\* What went wrong)' build.log | tail -n 100 || true
            echo '\`\`\`'
            echo '## Build log tail'
            echo '\`\`\`text'
            tail -n 100 build.log
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
          failure=$(grep -E '(^e: |Could not |FAILURE:|error:|Execution failed)' build.log | head -n 1 | cut -c1-500 || true)
          if [[ -n "$failure" ]]; then echo "::error title=Gradle build failure::$failure"; fi
          grep -A35 -B3 'What went wrong' build.log | tr '\n' ' ' | cut -c1-6000 | while IFS= read -r details; do echo "::error title=Gradle root cause::$details"; done
          exit "$result"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onimeku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
