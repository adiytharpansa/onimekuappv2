name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Isi tag (mis. v1.0.0-debug) untuk membuat GitHub Release berisi APK debug; kosongkan untuk build biasa"
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          # Opsional: aktifkan Sign in/Sign up (secret repo; kunci PUBLIK saja)
          ORG_GRADLE_PROJECT_ONIMEKU_SUPABASE_URL: ${{ secrets.ONIMEKU_SUPABASE_URL }}
          ORG_GRADLE_PROJECT_ONIMEKU_SUPABASE_KEY: ${{ secrets.ONIMEKU_SUPABASE_KEY }}
          ORG_GRADLE_PROJECT_ONIMEKU_TR_URL: ${{ secrets.ONIMEKU_TR_URL }}
          ORG_GRADLE_PROJECT_ONIMEKU_TR_KEY: ${{ secrets.ONIMEKU_TR_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # Artefak hanya jembatan ke rilis; jangan ditumpuk (kuota penyimpanan Actions 0,5 GB).
          retention-days: 3

      - name: Create GitHub Release with debug APK
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Onimeku Debug ${{ inputs.release_tag }}
          body: |
            APK debug Onimeku (Kotlin / Jetpack Compose) dari branch main.

            - Build debug resmi dari GitHub Actions repo ini (ditandatangani kunci debug Android, siap pasang untuk pengujian).
            - Aplikasi sudah tersambung ke API katalog Onimeku (onimekuappv2-api): daftar, detail, dan stream episode diambil langsung dari API.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
