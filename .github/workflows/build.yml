name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          { echo '## Build log'; echo '\`\`\`text'; tail -n 250 build.log; echo '\`\`\`'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onimeku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
