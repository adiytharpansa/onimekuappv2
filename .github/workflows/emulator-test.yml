name: Emulator Playback Test

on:
  workflow_dispatch:
    inputs:
      anime_id:
        description: "Slug katalog yang diuji putar"
        required: false
        type: string
        default: "attack-on-titan-season-3-part-2"
      ep:
        description: "Nomor episode"
        required: false
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run playback test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.onimeku.app/.MainActivity --ez test_home true
            sleep 25
            adb exec-out screencap -p > home.png
            adb shell uiautomator dump /sdcard/uih.xml || true
            adb pull /sdcard/uih.xml uih.xml || true
            adb shell am force-stop com.onimeku.app
            sleep 2
            adb shell am start -n com.onimeku.app/.MainActivity --es test_id "${{ inputs.anime_id }}" --ei test_ep ${{ inputs.ep }}
            sleep 30
            adb exec-out screencap -p > shot1.png
            adb shell uiautomator dump /sdcard/ui1.xml || true
            adb pull /sdcard/ui1.xml ui1.xml || true
            sleep 12
            adb exec-out screencap -p > shot2.png
            adb shell uiautomator dump /sdcard/ui2.xml || true
            adb pull /sdcard/ui2.xml ui2.xml || true
            adb logcat -d > logcat.txt || true
            adb shell dumpsys activity processes > processes.txt || true

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence
          path: |
            home.png
            uih.xml
            shot1.png
            shot2.png
            ui1.xml
            ui2.xml
            logcat.txt
            processes.txt
          if-no-files-found: warn
