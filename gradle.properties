org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Build lebih cepat (tidak memengaruhi isi aplikasi).
org.gradle.parallel=true
org.gradle.caching=true

# --- Akun (Sign in/Sign up lewat Supabase Auth) ---
# Isi dengan URL proyek dan kunci PUBLIK (sb_publishable_... / anon). Kosong = fitur akun nonaktif anggun.
# JANGAN memasukkan service_role key. Untuk CI, kirim sebagai -P atau env ORG_GRADLE_PROJECT_*.
ONIMEKU_SUPABASE_URL=
ONIMEKU_SUPABASE_KEY=

# --- Terjemahan subtitle bersama (Cloudflare Worker gratis; lihat server/README-translate.md) ---
# URL Worker + kunci aplikasi (sama dengan secret APP_KEY di Worker). Kosong = hanya ML Kit di HP.
ONIMEKU_TR_URL=
ONIMEKU_TR_KEY=
