org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Build lebih cepat (tidak memengaruhi isi aplikasi).
org.gradle.parallel=true
org.gradle.caching=true

# --- Akun & loker kunci (Firebase proyek khusus Onimeku) ---
# Isi dengan project id + Web API key klien Firebase proyek Onimeku. Kosong = fitur akun/loker nonaktif anggun.
# Untuk CI, kirim sebagai -P atau env ORG_GRADLE_PROJECT_*.
# ONIMEKU_FIREBASE_PROJECT_ID=<project-id>
# ONIMEKU_FIREBASE_API_KEY=<web-api-key>
# ONIMEKU_KEY_B_TEST=<debug-only>
